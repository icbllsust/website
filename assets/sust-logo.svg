<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" role="img" aria-label="Shahjalal University of Science and Technology Crest">
  <!-- Outer ring (navy) -->
  <circle cx="20" cy="20" r="19.25" fill="#102a43"/>
  <!-- Inner emerald ring -->
  <circle cx="20" cy="20" r="16.5" fill="none" stroke="#047857" stroke-width="1.25"/>
  <!-- Cream disc -->
  <circle cx="20" cy="20" r="14.5" fill="#fcfbf7"/>
  <!-- SUST label band along top arc -->
  <path id="topArc" d="M 8 20 A 12 12 0 0 1 32 20" fill="none"/>
  <text font-family="Inter, 'Noto Sans Bengali', sans-serif" font-size="3.2" font-weight="700" fill="#047857" letter-spacing="0.6">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">SUST</textPath>
  </text>
  <!-- Bengali sigil "অ" -->
  <text x="20" y="25.5" text-anchor="middle" font-family="'Noto Serif Bengali', 'Playfair Display', serif" font-size="13" font-weight="700" fill="#102a43">অ</text>
  <!-- Bottom emerald triple-dot motif -->
  <circle cx="16" cy="30" r="0.9" fill="#047857"/>
  <circle cx="20" cy="30" r="0.9" fill="#047857"/>
  <circle cx="24" cy="30" r="0.9" fill="#047857"/>
</svg>
